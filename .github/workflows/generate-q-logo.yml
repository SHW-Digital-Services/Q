
name: Generate q-logo-white on: workflow_dispatch:

jobs: generate: runs-on: ubuntu-latest steps: - name: Checkout uses: actions/checkout@v4 with: persist-credentials: true
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '18'

  - name: Install dependencies
    run: npm ci

  - name: Generate white logo
    run: node scripts/generate-q-logo.cjs

  - name: Commit and push generated asset
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "github-actions[bot]@users.noreply.github.com"
      git add public/q-logo-white.png || true
      if [ -n "$(git status --porcelain)" ]; then
        git commit -m "ci: generate q-logo-white.png [auto]" || true
        git push origin HEAD:feat/theme-toggle-assets
      else
        echo "No changes to commit"
      fi
