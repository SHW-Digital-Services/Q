name: Public website trust checks
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check public pages, TLS, redirects and crawl files
        run: node scripts/audit-public-trust.mjs
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-trust-audit
          path: artifacts/public-trust-audit.json
          retention-days: 30
