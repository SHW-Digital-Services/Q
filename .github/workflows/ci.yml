name: Application CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Local AI regression checks
        run: npm run check:local-ai

      - name: Online Users access and database policy checks
        run: npm run check:online-users

      - name: Brevo events and tracking checks
        run: npm run check:webhooks && npm run check:brevo-tracking

      - name: Support archive and permissions checks
        run: npm run check:support-archive

      - name: Production build
        run: npm run build

      - name: Public identity, crawl files and legal page checks
        run: npm run check:public-trust
