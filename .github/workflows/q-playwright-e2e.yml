name: Q Playwright E2E

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'server/**'
      - 'site-tests/q-playwright-tests/**'
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    uses: ./.github/workflows/q-playwright-run.yml
    secrets: inherit
    with:
      test-command: npm run test:e2e -- --project=${{ matrix.project }} --workers=2
      install-browsers: ${{ matrix.project }}
      artifact_suffix: ${{ matrix.project }}
