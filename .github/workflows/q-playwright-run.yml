name: Q Playwright Runner

on:
  workflow_call:
    inputs:
      test-command:
        required: true
        type: string
      install-browsers:
        required: true
        type: string
      artifact_suffix:
        required: false
        type: string
        default: results

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: site-tests/q-playwright-tests
    env:
      CI: 'true'
      BASE_URL: http://127.0.0.1:3000
      VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      FREE_USER_EMAIL: ${{ secrets.TEST_FREE_USER_EMAIL }}
      FREE_USER_PASSWORD: ${{ secrets.TEST_FREE_USER_PASSWORD }}
      SUBSCRIBER_EMAIL: ${{ secrets.TEST_SUBSCRIBER_EMAIL }}
      SUBSCRIBER_PASSWORD: ${{ secrets.TEST_SUBSCRIBER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      PAYPAL_ENV: ${{ secrets.TEST_PAYPAL_ENV || 'sandbox' }}
      PAYPAL_SANDBOX_CLIENT_ID: ${{ secrets.TEST_PAYPAL_SANDBOX_CLIENT_ID }}
      PAYPAL_SANDBOX_CLIENT_SECRET: ${{ secrets.TEST_PAYPAL_SANDBOX_CLIENT_SECRET }}
      PAYPAL_SANDBOX_WEBHOOK_ID: ${{ secrets.TEST_PAYPAL_SANDBOX_WEBHOOK_ID }}
      PAYPAL_SANDBOX_PLAN_ID_MONTHLY: ${{ secrets.TEST_PAYPAL_SANDBOX_PLAN_ID_MONTHLY }}
      PAYPAL_SANDBOX_PLAN_ID_YEARLY: ${{ secrets.TEST_PAYPAL_SANDBOX_PLAN_ID_YEARLY }}

    steps:
      - name: Checkout Q
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site-tests/q-playwright-tests/package-lock.json

      - name: Install Q dependencies
        run: npm ci
        working-directory: .

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: |
          if [[ "${{ inputs.install-browsers }}" == "all" ]]; then
            npx playwright install --with-deps
          else
            npx playwright install --with-deps "${{ inputs.install-browsers }}"
          fi

      - name: Type-check tests
        run: npm run typecheck

      - name: Run Playwright tests
        run: ${{ inputs.test-command }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}-${{ inputs.artifact_suffix }}
          path: |
            site-tests/q-playwright-tests/playwright-report/
            site-tests/q-playwright-tests/test-results/
          retention-days: 14

