name: Q Playwright E2E

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'server/**'
      - 'site-tests/q-playwright-tests/**'
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site-tests/q-playwright-tests
    env:
      CI: 'true'
      BASE_URL: http://127.0.0.1:3000
      VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      FREE_USER_EMAIL: ${{ secrets.TEST_FREE_USER_EMAIL }}
      FREE_USER_PASSWORD: ${{ secrets.TEST_FREE_USER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

    steps:
      - name: Checkout Q
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site-tests/q-playwright-tests/package-lock.json

      - name: Install Q dependencies
        run: npm ci
        working-directory: .

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Type-check tests
        run: npm run typecheck

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site-tests/q-playwright-tests/playwright-report/
          retention-days: 14

