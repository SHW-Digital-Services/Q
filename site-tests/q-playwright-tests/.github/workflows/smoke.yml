name: Q Playwright Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site-tests/q-playwright-tests
    env:
      CI: 'true'
      BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout Q
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site-tests/q-playwright-tests/package-lock.json

      - name: Install Q dependencies
        run: npm ci
        working-directory: .

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke -- --project=chromium

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-playwright-report
          path: site-tests/q-playwright-tests/playwright-report/
          retention-days: 7

